<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PYXIS | BHC Inventory</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @media print {
            .sidebar, .top-nav, .btn-submit, .search-container, .nav-icons, .management-grid { display: none !important; }
            .main-body { margin-left: 0 !important; padding: 0 !important; width: 100% !important; }
            .app-shell { display: block !important; }
            .table-card { box-shadow: none !important; border: 1px solid #eee; }
            body { background: white !important; }
        }
        
        /* Layout for the merged Inventory View */
        .management-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 25px;
            margin-bottom: 30px;
        }
        .category-pills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
            max-height: 120px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div id="login-screen" class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <i class="fa-solid fa-staff-snake"></i>
                <h1>PYXIS</h1>
            </div>
            
            <div class="auth-form">
                <div class="input-field" style="margin-bottom: 20px;">
                    <label>Admin Username</label>
                    <input type="text" id="username" spellcheck="false" autocomplete="off">
                </div>
                
                <div class="input-field" style="margin-bottom: 25px;">
                    <label>Access Password</label>
                    <input type="password" id="password">
                </div>
                
                <button onclick="app.login()" class="btn-submit">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In to Portal
                </button>
            </div>

            <div style="margin-top: 30px; color: #94a3b8; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; gap: 8px;">
                <i class="fa-solid fa-shield-halved"></i> 
                <span>Secured Local Cloud Access</span>
            </div>
        </div>
    </div>

    <div id="app-interface" class="app-shell hidden">
        <aside class="sidebar" id="main-sidebar">
            <div class="sidebar-top">
                <div class="sidebar-toggle" onclick="ui.toggleSidebar()" style="color: white; padding: 10px 25px; cursor: pointer; font-size: 1.2rem; opacity: 0.7;">
                    <i class="fa-solid fa-bars"></i>
                </div>

                <div class="sidebar-brand">
                    <span>PYXIS<span>.</span></span>
                </div>
                <nav class="nav-stack">
                    <div class="nav-link" onclick="ui.view('dashboard')" id="tab-dashboard">
                        <i class="fa-solid fa-house"></i> <span>Dashboard</span>
                    </div>
                    <div class="nav-link" onclick="ui.view('inventory')" id="tab-inventory">
                        <i class="fa-solid fa-boxes-stacked"></i> <span>Inventory Control</span>
                    </div>
                    <div class="nav-link" onclick="ui.view('reports')" id="tab-reports">
                        <i class="fa-solid fa-file-contract"></i> <span>Audit Reports</span>
                    </div>
                </nav>
            </div>
            
            <div class="sidebar-footer">
                <div class="nav-link logout-action" onclick="app.logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> <span>Sign Out</span>
                </div>
            </div>
        </aside>

        <div class="main-container">
            <header id="main-header" class="top-nav">
                <div class="nav-left">
                    <span id="view-title">DASHBOARD</span>
                </div>

                <div class="search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="global-search" placeholder="Quick search..." onkeyup="ui.filterInventory()">
                </div>
                
                <div class="header-tools">
                    <div class="nav-icons">
                        <div class="icon-btn">
                            <i class="fa-regular fa-bell" id="notif-bell"></i>
                            <span id="alert-badge">0</span>
                        </div>
                    </div>
                    <div class="user-profile">
                        <div class="u-info">
                            <span class="u-name">Administrator</span>
                            <span class="u-loc">BHC Indangan</span>
                        </div>
                        <div class="u-avatar">AD</div>
                    </div>
                </div>
            </header>

            <section id="render-area" class="view-content"></section>
        </div>
    </div>

    <template id="tpl-dashboard">
        <div class="stats-row" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;">
            <div class="stat-card">
                <div class="icon-circle bg-blue"><i class="fa-solid fa-pills"></i></div>
                <div><h3 id="stat-count">0</h3><p>Total Items</p></div>
            </div>
            <div class="stat-card">
                <div class="icon-circle bg-green"><i class="fa-solid fa-cubes"></i></div>
                <div><h3 id="stat-units">0</h3><p>Total Units</p></div>
            </div>
            <div class="stat-card" id="card-low-stock">
                <div class="icon-circle bg-red"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <div><h3 id="stat-low">0</h3><p>Low Stock</p></div>
            </div>
            <div class="stat-card">
                <div class="icon-circle bg-red"><i class="fa-solid fa-calendar-xmark"></i></div>
                <div><h3 id="stat-expiry">0</h3><p>Near Expiry</p></div>
            </div>
        </div>

        <div class="analytics-card">
            <div class="analytics-header">
                <h3>Inventory Movement (Last 7 Days)</h3>
                <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">
                    <i class="fa-solid fa-circle" style="color: #0ea5e9; margin-right: 5px;"></i> Arrivals
                    <i class="fa-solid fa-circle" style="color: #ef4444; margin: 0 5px 0 15px;"></i> Dispensed
                </div>
            </div>
            <div class="chart-container">
                <canvas id="analyticsChart"></canvas>
            </div>
        </div>

        <div class="form-card" style="max-width: 100%; margin-top: 20px;">
            <div class="form-header">
                <i class="fa-solid fa-heart-pulse" style="color: var(--accent-blue);"></i>
                <h2 style="display: inline; margin-left: 10px;">System Health</h2>
            </div>
            <p style="margin-top: 15px; font-weight: 600;">
                Connection: <span style="color: #22c55e;">● Cloud Sync Active</span>
            </p>
        </div>
    </template>

    <template id="tpl-inventory">
        <div class="management-grid">
            <div class="form-card">
                <div class="form-header">
                    <i class="fa-solid fa-tags" style="color: var(--accent-blue);"></i>
                    <h3>Categories</h3>
                </div>
                <div style="display: flex; gap: 8px; margin-top: 15px;">
                    <input type="text" id="new-category-name" placeholder="New Category..." style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border);">
                    <button class="btn-submit" onclick="app.addCategory()" style="margin: 0; width: auto; padding: 0 15px;">Add</button>
                </div>
                <div id="categories-list" class="category-pills-container"></div>
            </div>

            <div class="form-card">
                <div class="form-header">
                    <i class="fa-solid fa-circle-plus" style="color: var(--accent-blue);"></i>
                    <h3>Quick Register</h3>
                </div>
                <div class="form-grid" style="margin-top: 15px;">
                    <div class="form-group"><input type="text" id="n" placeholder="Item Name" required></div>
                    <div class="form-group"><select id="c" required><option value="">Select Category</option></select></div>
                    <div class="form-group"><input type="number" id="q" placeholder="Qty" required></div>
                    <div class="form-group"><input type="date" id="e" required></div>
                </div>
                <button class="btn-submit" onclick="ui.handleSave()" style="margin-top: 15px;">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Save to Inventory
                </button>
            </div>
        </div>

        <div class="table-card">
            <div style="padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
                <h3 style="font-weight: 800;">INVENTORY LIST</h3>
                <input type="text" id="search-bar" placeholder="Filter list..." onkeyup="ui.filterInventory()" style="max-width: 300px; padding: 8px 15px; border-radius: 20px; border: 1px solid var(--border);">
            </div>
            <table class="modern-table">
                <thead>
                    <tr>
                        <th>ITEM DETAILS</th>
                        <th>CATEGORY</th>
                        <th>STOCK LEVEL</th>
                        <th>EXPIRY</th>
                        <th style="text-align:right">ACTIONS</th>
                    </tr>
                </thead>
                <tbody id="inventory-table-body"></tbody>
            </table>
        </div>
    </template>

    <template id="tpl-reports">
        <div class="form-card" style="margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between;">
            <div>
                <h2>Pharmacy Audit Report</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Full historical logs of movements.</p>
            </div>
            <button class="btn-submit" onclick="window.print()" style="width: auto; padding: 0 30px;">
                <i class="fa-solid fa-print"></i> Generate PDF
            </button>
        </div>

        <div class="table-card">
            <table class="modern-table">
                <thead>
                    <tr>
                        <th>DATE & TIME</th>
                        <th>ITEM NAME</th>
                        <th>TYPE</th>
                        <th>QUANTITY</th>
                        <th>STATUS</th>
                    </tr>
                </thead>
                <tbody id="audit-table-body"></tbody>
            </table>
        </div>
    </template>
    
    <script src="script.js"></script>
</body>
</html>
